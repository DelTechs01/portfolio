<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0b0d" />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="description"
      content="Kweyu Delron  - Software Engineer, Network Engineer & IT Solutions specialist building secure, scalable, AI-powered systems."
    />
    <meta name="author" content="Kweyu Delron " />

    <!-- Fonts: Geist (text + headings) + Geist Mono (labels/code) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Open Graph / social preview -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Kweyu Delron  - Software & Network Engineer"
    />
    <meta
      property="og:description"
      content="Building secure, scalable, and AI-powered solutions. Backend development, networking, cybersecurity & blockchain."
    />
    <meta property="og:image" content="/pwa-512x512.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <title>Kweyu Delron - Software & Network Engineer</title>

    <!-- Apply theme before paint to avoid a flash. Dark is the default;
         light only when the visitor has explicitly opted in. -->
    <script>
      (function () {
        try {
          if (localStorage.getItem("darkMode") !== "false") {
            document.documentElement.classList.add("dark");
          }
          var fs = localStorage.getItem("fontSize") || "100";
          document.documentElement.style.fontSize = fs + "%";
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
