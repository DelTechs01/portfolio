<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4f46e5" />
    <meta
      name="description"
      content="Kweyu Delron  - Software Engineer, Network Engineer & IT Solutions specialist building secure, scalable, AI-powered systems."
    />
    <meta name="author" content="Kweyu Delron " />

    <!-- Fonts: Inter (body) + Sora (headings) + JetBrains Mono (labels/code) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Open Graph / social preview -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Kweyu Delron  - Software & Network Engineer"
    />
    <meta
      property="og:description"
      content="Building secure, scalable, and AI-powered solutions. Backend development, networking, cybersecurity & blockchain."
    />
    <meta property="og:image" content="/pwa-512x512.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <title>Kweyu Delron - Software & Network Engineer</title>

    <!-- Apply theme before paint to avoid a flash. Light is the default;
         dark only when the visitor has explicitly opted in. -->
    <script>
      (function () {
        try {
          if (localStorage.getItem("darkMode") === "true") {
            document.documentElement.classList.add("dark");
          }
          var fs = localStorage.getItem("fontSize") || "90";
          document.documentElement.style.fontSize = fs + "%";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
